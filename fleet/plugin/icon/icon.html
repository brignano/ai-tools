<!-- Fleet plugin icon source. Rendered at 1024x1024 with brignano/design tokens.css and fonts/ beside it (dark theme: --bg, --mark, the A|B monogram in the .stamp treatment: Geist at --weight-heavy, spaced open with --tracking-caps) into .claude-plugin/icon.png. -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
@font-face{font-family:Geist;font-weight:100 900;src:url(fonts/geist-latin-wght-normal.woff2) format('woff2');}
html,body{margin:0;width:1024px;height:1024px;background:var(--bg);}
.i{width:1024px;height:1024px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:80px;}
/* .stamp (components.css), in --mark; the negative margin takes back the tracking after the B so the monogram centres. */
.m{font-family:Geist,var(--sans);font-weight:var(--weight-heavy);letter-spacing:var(--tracking-caps);margin-right:calc(-1 * var(--tracking-caps));white-space:nowrap;font-size:360px;line-height:1;color:var(--mark);}
.t{width:660px;height:28px;background:var(--mark);border-radius:14px;}
</style></head><body><div class="i"><div class="m">A|B</div><div class="t"></div></div></body></html>
