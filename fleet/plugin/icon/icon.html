<!-- Fleet plugin icon source. Rendered at 1024x1024 with brignano/design tokens.css and fonts/ beside it (dark theme: --bg, --mark, Silkscreen monogram) into .claude-plugin/icon.png. -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
@font-face{font-family:Silkscreen;src:url(fonts/silkscreen-latin-400-normal.woff2) format('woff2');}
html,body{margin:0;width:1024px;height:1024px;background:var(--bg);}
.i{width:1024px;height:1024px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:80px;}
.m{font-family:Silkscreen,monospace;font-size:400px;line-height:1;color:var(--mark);letter-spacing:-8px;}
.t{width:660px;height:28px;background:var(--mark);border-radius:14px;}
</style></head><body><div class="i"><div class="m">A|B</div><div class="t"></div></div></body></html>
