name: Bug
description: Something is broken.
labels: [type:bug, proposed]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens, and what should happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1. 
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] The steps above no longer reproduce it
        - [ ] A test covers it
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: How to verify
      description: The exact commands or checks that prove the fix.
      render: shell
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Logs, screenshots, version, files likely involved.
