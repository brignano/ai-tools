name: Task (agent-ready spec)
description: Work for the agent fleet. Fill every section; a builder skips an issue that lacks one.
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing, and who it hurts. One paragraph.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes, checkable from the diff or a command.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: How to verify
      description: The exact commands or checks that prove it (the repo's own, e.g. `npm test`).
      render: shell
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions
      description: Approach (one, not options), files to touch, code to reuse, and every choice a builder could make two ways, already made. End with "Do not decide:" and what to ask about instead. Without this the issue is held.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this deliberately does not do.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Files likely involved, links to the brief or proposal, risks.
