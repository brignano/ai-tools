name: fleet-labels

# Syncs fleet/labels.yml to every repo I own. A pull request that changes the
# labels gets a dry run, so the diff to every repo is in the PR's checks.
on:
  push:
    branches: [main]
    paths: [fleet/labels.yml, fleet/sync-labels.py, .github/workflows/fleet-labels.yml]
  pull_request:
    paths: [fleet/labels.yml, fleet/sync-labels.py, .github/workflows/fleet-labels.yml]
  schedule:
    - cron: "17 13 * * 1" # Mondays, ~9am ET: catches repos created since
  workflow_dispatch:
    inputs:
      apply:
        description: Make the changes (unchecked = dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fleet-labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check the token is set
        id: token
        env:
          TOKEN: ${{ secrets.FLEET_LABELS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::FLEET_LABELS_TOKEN is not set; skipping. See fleet/README.md#labels."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLEET_LABELS_TOKEN }}
          APPLY: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.apply == true }}
        run: |
          pip install --quiet pyyaml
          if [ "$APPLY" = "true" ]; then
            python3 fleet/sync-labels.py --apply | tee summary.txt
          else
            python3 fleet/sync-labels.py | tee summary.txt
          fi
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
